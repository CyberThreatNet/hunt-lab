name: Validate Sigma rules

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sigma:
    name: sigma check and test conversions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install sigma-cli and pySigma back ends (pinned)
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            sigma-cli==3.1.0 \
            pysigma==1.5.1 \
            pysigma-backend-kusto==1.0.1 \
            pysigma-backend-splunk==2.1.0 \
            pysigma-backend-elasticsearch==2.1.1 \
            pyyaml
          sigma version

      - name: Check all YAML parses
        run: |
          python - <<'PY'
          import pathlib, sys, yaml
          bad = 0
          for p in sorted(pathlib.Path(".").rglob("*.y*ml")):
              if ".git" in p.parts:
                  continue
              try:
                  yaml.safe_load(p.read_text(encoding="utf-8"))
                  print(f"ok   {p}")
              except yaml.YAMLError as exc:
                  bad += 1
                  print(f"FAIL {p}: {exc}")
          sys.exit(1 if bad else 0)
          PY

      - name: KEV and EPSS context is present and well formed
        # Offline: checks each hunt's cve-context.yaml against its rule.yml CVE tags and the README table.
        # Values are refreshed by running scripts/refresh_kev_epss.py without --check.
        run: python scripts/refresh_kev_epss.py --check

      - name: KEV and EPSS refresh script safety tests
        # Offline (simulated feeds), on a temporary copy of the repository: failed or partial
        # feed answers must change nothing, and an EPSS outage must exit with code 3.
        run: bash scripts/tests/test_refresh_kev_epss.sh

      - name: Elastic regex checker unit tests
        # Offline: known patterns that scripts/check_elastic_regex.py must flag or pass.
        run: python scripts/tests/test_check_elastic_regex.py

      - name: Elastic field-mapping checker unit tests
        # Offline: rules and pipelines that scripts/check_elastic_fields.py must flag or pass.
        run: python scripts/tests/test_check_elastic_fields.py

      - name: sigma check (fail on errors and issues)
        # Hunt rule files are named rule.yml or rule-<topic>.yml inside each dated hunt folder, not by
        # SigmaHQ's naming convention, so the filename-convention validators are excluded.
        run: |
          sigma check --fail-on-error --fail-on-issues \
            -x filename_length -x duplicate_filename \
            --junitxml sigma-check.junit.xml \
            hunts/

      - name: Test conversions (per-hunt targets from ci-targets.txt; missing or empty is an error)
        # Every rule YAML in a hunt folder (any *.yml or *.yaml with a detection section) is converted
        # with that folder's targets. Elastic targets (esql; eql or lucene if ever allowed) also need every
        # Sigma |re value to work on Elastic's Lucene regex engine (whole-value match with a leading .*;
        # no ^ or $ anchors, \b, (?...) groups or |re|i/m/s modifiers): scripts/check_elastic_regex.py.
        # They must also use a repository pipeline that maps every field the rule uses for its logsource
        # category, or the output keeps bare Sigma names that Elastic rejects (EQL, ES|QL) or never matches (Lucene): scripts/check_elastic_fields.py.
        shell: bash
        run: |
          set -euo pipefail
          allowed='^-t (kusto -p (microsoft_xdr|sentinel_asim|azure_monitor)|splunk (--without-pipeline|-p (splunk_windows|splunk_cim))|esql -p pipelines/ecs-process-creation\.yml)$'
          fail=0
          mapfile -t rules < <(python - <<'PY'
          import pathlib, yaml
          for p in sorted(pathlib.Path("hunts").rglob("*.y*ml")):
              if p.suffix not in (".yml", ".yaml"):
                  continue
              docs = list(yaml.safe_load_all(p.read_text(encoding="utf-8")))
              if any(isinstance(d, dict) and "detection" in d for d in docs):
                  print(p)
          PY
          )
          if (( ${#rules[@]} == 0 )); then echo "::error::no rule YAML with a detection section found under hunts/"; exit 1; fi
          for rule in "${rules[@]}"; do
            targets="$(dirname "${rule}")/ci-targets.txt"
            echo "::group::${rule}"
            if [[ ! -f "${targets}" ]]; then
              echo "::error file=${rule}::missing ${targets}; every hunt must declare its conversion targets"
              fail=1; echo "::endgroup::"; continue
            fi
            n=0
            while IFS= read -r line || [[ -n "${line}" ]]; do
              line="${line%$'\r'}"
              [[ "${line}" =~ ^[[:space:]]*(#|$) ]] && continue
              if [[ ! "${line}" =~ ${allowed} ]]; then
                echo "::error file=${targets}::target not on the allow-list: ${line}"; fail=1; continue
              fi
              read -r -a args <<< "${line}"
              if [[ "${args[1]}" =~ ^(esql|eql|lucene|elastalert)$ ]]; then
                rc=0; python scripts/check_elastic_regex.py "${rule}" < /dev/null || rc=$?
                if (( rc == 2 )); then
                  echo "::error file=${rule}::regex check could not read the rule: ${line}"; fail=1; continue
                elif (( rc != 0 )); then
                  echo "::error file=${targets}::regex not usable on Elastic, so this target would pass a conversion that can never match: ${line}"; fail=1; continue
                fi
                if [[ "${args[2]:-}" != "-p" || ! -f "${args[3]:-}" ]]; then
                  echo "::error file=${targets}::Elastic target without a repository pipeline file, so its field mapping can't be checked: ${line}"; fail=1; continue
                fi
                rc=0; python scripts/check_elastic_fields.py "${args[3]}" "${rule}" < /dev/null || rc=$?
                if (( rc == 2 )); then
                  echo "::error file=${rule}::field check could not read the rule or pipeline: ${line}"; fail=1; continue
                elif (( rc != 0 )); then
                  echo "::error file=${targets}::rule uses a field that ${args[3]} doesn't map, so Elastic would reject or never match this target: ${line}"; fail=1; continue
                fi
              fi
              if sigma convert "${args[@]}" "${rule}" < /dev/null > /dev/null; then
                n=$((n + 1)); echo "ok   ${line}"
              else
                echo "::error file=${rule}::conversion failed: ${line}"; fail=1
              fi
            done < "${targets}"
            if (( n == 0 )); then echo "::error file=${targets}::no conversion target succeeded or none declared"; fail=1; fi
            echo "::endgroup::"
          done
          exit "${fail}"

      - name: Upload sigma check report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sigma-check-report
          path: sigma-check.junit.xml
          if-no-files-found: ignore

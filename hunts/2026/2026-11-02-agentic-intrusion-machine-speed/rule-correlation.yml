title: Machine-Speed Discovery Burst From One Interpreter Process
id: 052b5be8-1b41-492a-97b5-8662c2e20fb0
status: experimental
description: |
  Fires when a single script interpreter process on one host spawns many distinct discovery or
  staging commands within two minutes. Agent-driven intrusions tend to chain tools faster and
  more systematically than a human at a keyboard. This is general hunting guidance; Chainalysis
  has not published the techniques used against it.
references:
  - https://www.chainalysis.com/blog/security-incident-october-30/
  - https://github.com/CyberThreatNet/hunt-lab/tree/main/hunts/2026/2026-11-02-agentic-intrusion-machine-speed
author: Cyber-Threat.net Hunt Lab
date: 2026-11-02
tags:
  - attack.discovery
  - attack.t1082
  - attack.collection
  - attack.t1119
correlation:
  type: value_count
  rules:
    - linux_discovery_from_interpreter
  group-by:
    - Computer
    - ParentProcessId
  timespan: 2m
  condition:
    field: Image
    gte: 6
falsepositives:
  - Inventory or monitoring scripts that run many commands at once
level: medium

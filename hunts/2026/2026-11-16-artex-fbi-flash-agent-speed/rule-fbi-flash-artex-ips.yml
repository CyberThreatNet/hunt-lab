title: FBI FLASH ARTEX Campaign IP Addresses
id: 4f586c16-62a6-47a0-a3c1-7a64e2525f9e
status: experimental
description: |
  Detects network connections to IPv4 addresses published in FBI
  FLASH-20261113-001 as historically observed ARTEX campaign
  infrastructure. The FLASH and its companion spreadsheet warn that
  these addresses may be reassigned and should not be treated as
  standalone indicators. Treat hits as leads and corroborate them.
references:
  - https://www.ic3.gov/CSA/2026/261113.pdf
  - https://www.ic3.gov/CSA/2026/261113.csv
  - https://cyber-threat.net/git/hunt-lab/hunts/2026/2026-11-16-artex-fbi-flash-agent-speed/
author: Cyber-Threat.net Hunt Lab

title: SSH Password Accept for Common Star-Shadow Accounts
id: 7c2e9a14-5b8d-4f21-9c6a-0e3d1b7a4f55
status: experimental
description: |
  Detects successful SSH password authentication for account names that commonly
  ship with a '*' password field on Alpine and other key-only deployments
  (alpine, root, deploy, git). On musl OpenSSH without PAM this can indicate
  CVE-2026-123158 (*sshole) abuse. Corroborate with /etc/shadow showing '*' for
  the same user. Authorised password use of these accounts will also match.
references:
  - https://www.alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/
  - https://www.openssh.org/releasenotes.html#10.6p2
  - https://www.openwall.com/lists/oss-security/2026/11/05/3
  - https://github.com/CyberThreatNet/hunt-lab/tree/main/hunts/2026/2026-11-06-openssh-sshole-musl
author: Cyber-Threat.net Hunt Lab
date: 2026-11-06
tags:
  - attack.credential-access
  - attack.t1110
  - attack.persistence
  - attack.t1078
  - cve.2026-123158
  - detection.emerging-threats
logsource:
  product: linux
  service: auth
detection:
  selection:
    message|contains:
      - 'Accepted password for alpine'
      - 'Accepted password for root'
      - 'Accepted password for deploy'
      - 'Accepted password for git'
  condition: selection
fields:
  - message
  - user
  - src_ip
  - hostname
falsepositives:
  - Accounts that legitimately use password authentication under those names
  - Log replays and SIEM test events
level: high

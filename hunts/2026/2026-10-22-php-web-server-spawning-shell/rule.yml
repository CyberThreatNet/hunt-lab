title: Shell or Download Tool Spawned by a PHP Worker or Web Server (Linux)
id: cb73f284-3325-4288-a720-c3475ec308a7
status: experimental
description: |
    Hunting starting point for possible post-exploitation of the critical PHP flaws
    CVE-2026-109618 and CVE-2026-109619 (unauthenticated remote code execution).
    Flags a PHP worker or PHP-capable web server process starting a shell or a
    download/scripting tool. Behaviour-based, not an exploit signature. Needs tuning.
references:
    - https://www.php.net/archive/2026.php
    - https://www.ncsc.gov.uk/news/critical-security-issue-affecting-php
    - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_webshell_detection.yml
    - https://github.com/CyberThreatNet/hunt-lab/tree/main/hunts/2026/2026-10-22-php-web-server-spawning-shell
author: Cyber-Threat.net Hunt Lab
date: 2026-10-22
tags:
    - attack.initial-access
    - attack.t1190
    - attack.execution
    - attack.t1059.004
    - attack.command-and-control
    - attack.t1105
    - attack.persistence
    - attack.t1505.003
    - cve.2026-109618
    - cve.2026-109619
logsource:
    product: linux
    category: process_creation
detection:
    selection_parent_php:
        ParentImage|re: '/php(-fpm|-cgi)?[0-9.]*$'
    selection_parent_web:
        ParentImage|endswith:
            - '/httpd'
            - '/apache2'
            - '/frankenphp'
            - '/lsphp'
    selection_child:
        Image|endswith:
            - '/sh'
            - '/bash'
            - '/dash'
            - '/curl'
            - '/wget'
            - '/nc'
            - '/ncat'
            - '/perl'
            - '/python3'
            - '/base64'
    condition: 1 of selection_parent_* and selection_child
falsepositives:
    - PHP applications that legitimately shell out (exec, system, proc_open), e.g. image, PDF or mail tools
    - Cron, deployment and Composer jobs run with the PHP CLI
    - Monitoring or health-check scripts run by the web server user
level: medium

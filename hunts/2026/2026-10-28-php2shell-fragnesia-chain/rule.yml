title: PHP Worker or Web Server Spawns Shell or Interpreter (PHP2Shell/Fragnesia Chain)
id: 375fb2d6-f28a-43c7-beb2-8b369f651c3d
status: experimental
description: |
    Hunting starting point for post-exploitation of PHP2Shell (CVE-2026-109618 /
    CVE-2026-109619) when chained with the Fragnesia local privilege escalation
    (CVE-2026-46300). Flags a PHP worker or PHP-capable web server process
    starting a shell, scripting interpreter or download tool. Dream Research
    (26 October 2026) documented a custom PHP2Shell weaponisation that reaches
    code execution as a low-privilege web user before the Fragnesia stage.
    Behaviour-based, not an exploit signature. Companion to the 2026-10-22 PHP
    spawn hunt and to rule-pam.yml in this folder. Needs tuning.
references:
    - https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers
    - https://www.php.net/archive/2026.php
    - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    - https://ubuntu.com/security/CVE-2026-46300
    - https://nvd.nist.gov/vuln/detail/CVE-2026-46300
    - https://github.com/CyberThreatNet/hunt-lab/tree/main/hunts/2026/2026-10-28-php2shell-fragnesia-chain
author: Cyber-Threat.net Hunt Lab
date: 2026-10-28
tags:
    - attack.initial-access
    - attack.t1190
    - attack.execution
    - attack.t1059.004
    - attack.privilege-escalation
    - attack.t1068
    - attack.persistence
    - attack.t1505.003
    - cve.2026-109618
    - cve.2026-109619
    - cve.2026-46300
logsource:
    product: linux
    category: process_creation
detection:
    selection_parent_php:
        ParentImage|re: '/php(-fpm|-cgi)?[0-9.]*$'
    selection_parent_web:
        ParentImage|endswith:
            - '/httpd'
            - '/apache2'
            - '/nginx'
            - '/frankenphp'
            - '/lsphp'
            - '/appweb'
    selection_child:
        Image|endswith:
            - '/sh'
            - '/bash'
            - '/dash'
            - '/curl'
            - '/wget'
            - '/nc'
            - '/ncat'
            - '/perl'
            - '/python'
            - '/python3'
            - '/base64'
            - '/su'
    condition: 1 of selection_parent_* and selection_child
falsepositives:
    - PHP applications that legitimately shell out (exec, system, proc_open), e.g. image, PDF or mail tools
    - Cron, deployment and Composer jobs run with the PHP CLI
    - Monitoring or health-check scripts run by the web server user
    - Appliance maintenance scripts that call su under a web parent (rare; investigate)
level: medium

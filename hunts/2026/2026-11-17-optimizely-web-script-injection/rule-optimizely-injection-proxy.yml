title: Web Proxy Request to Optimizely Injection Payload Hosts (November 2026)
id: 31641a4e-602a-4750-ba35-84740f618ed6
status: experimental
description: |
  Detects web requests to attacker hosts used when malicious JavaScript was
  injected into Optimizely Web snippets on 16 November 2026 (Report URI).
  A hit means a browser behind the proxy loaded the payload, posted data to
  the collection server, or reached the iOS exploit routers. The hosts are
  historical; some were taken down on 17 November 2026.
references:
  - https://blog.report-uri.com/worlds-largest-brands-infected-with-malware-via-optimizely/
  - https://www.bleepingcomputer.com/news/security/optimizely-supply-chain-attack-infects-major-brands-sites-with-malware/
  - https://cyber-threat.net/git/hunt-lab/hunts/2026/2026-11-17-optimizely-web-script-injection/
author: Cyber-Threat.net Hunt Lab
date: 2026-11-17
tags:
  - attack.initial-access
  - attack.t1189
  - attack.t1195.002
  - attack.collection
  - attack.t1056
  - attack.exfiltration
  - attack.t1041
  - detection.emerging-threats
logsource:
  category: proxy
detection:
  selection:
    cs-host|endswith:
      - '1688360.cc'
      - '5vobauua3ojpklx.icu'
      - 'eil786npto9u5bq.icu'
      - 'l7bcsnwc7nzr3uo.icu'
      - 'webshell.lol'
      - 'linkforge.cc'
      - 'je4ft3gn8vxudum.icu'
      - 'q1ls1ho9x7wsxlu.icu'
      - 'ios-hack.icu'
      - 'p55abnw2pnsz0bo.icu'
      - '1y69gy2mdzaltz1.icu'
      - 'gm38duxoihbmy5o.icu'
  condition: selection
falsepositives:
  - Security researchers, sandboxes and URL scanners fetching the payload.
level: high

title: Dokploy Compose Service Label Injection in Docker Command
id: b4efa5c7-1eb5-43f6-8bb5-e1e60915f208
status: experimental
description: |
  Detects potential OS command injection in Dokploy backup commands by looking for
  shell metacharacters in the 'com.docker.compose.service' Docker label filter.
  Dokploy uses a shell command to identify containers for backups. If the serviceName
  parameter contains shell metacharacters, it may allow command execution.
  This rule targets the specific vulnerability in Dokploy prior to 0.31.1 (CVE-2026-129433).
  Licence: DRL 1.1.
author: Cyber-Threat.net Hunt Lab
date: 2026-11-18
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    CommandLine|contains: 'label=com.docker.compose.service='
    CommandLine|re: 'label=com\.docker\.compose\.service=[^"]*[;`$|&<>]'
  condition: selection
falsepositives:
  - none expected; service names with shell characters are not valid Compose service names
level: high
tags:
  - attack.execution
  - attack.t1059.004
  - attack.privilege-escalation
  - attack.t1611
  - cve.2026-129433
  - detection.emerging-threats
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2026-129433
  - https://github.com/Dokploy/dokploy/security/advisories/GHSA-j329-jw7j-rxjm
  - https://github.com/Dokploy/dokploy/security/advisories

title: Magento Custom Options Upload Directory Receives PHP Webshell
id: 75cd1de6-4eca-4169-b548-17cea6700740
status: experimental
description: |
    Hunting starting point for post-exploitation of CVE-2026-48356
    ("PolyShell"), an unrestricted file upload in Magento Open Source and
    Adobe Commerce guest-cart REST custom options. Flags creation of PHP,
    PHTML or PHAR files under pub/media/custom_options/, where Sansec and
    Adobe document that polyglot uploads land. Behaviour-based on the path
    and extension, not an exploit signature. Needs Sysmon event 11, Elastic
    Defend file events, or equivalent file-create telemetry covering the
    Magento document root.
references:
    - https://www.adobe.com/trust/security/products/commerce/apsb26-73.html
    - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    - https://sansec.io/research/magento-polyshell
    - https://nvd.nist.gov/vuln/detail/CVE-2026-48356
    - https://github.com/CyberThreatNet/hunt-lab/tree/main/hunts/2026/2026-10-27-magento-polyshell-webshell
author: Cyber-Threat.net Hunt Lab
date: 2026-10-27
modified: 2026-10-27
tags:
    - attack.initial-access
    - attack.t1190
    - attack.persistence
    - attack.t1505.003
    - cve.2026-48356
logsource:
    category: file_event
detection:
    selection_path:
        TargetFilename|contains:
            - '/pub/media/custom_options/'
            - '\pub\media\custom_options\'
            - '/media/custom_options/'
            - '\media\custom_options\'
    selection_ext:
        TargetFilename|endswith:
            - '.php'
            - '.phtml'
            - '.phar'
            - '.PHP'
            - '.PHTML'
            - '.PHAR'
    filter_htaccess:
        TargetFilename|endswith:
            - '/.htaccess'
            - '\.htaccess'
    condition: selection_path and selection_ext and not filter_htaccess
falsepositives:
    - Legitimate Magento deployments that intentionally store PHP under custom_options (none expected; this path is for customer option file uploads)
    - Incident responders recreating sample webshells during a drill
level: high

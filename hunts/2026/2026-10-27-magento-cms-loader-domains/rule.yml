title: Magento PolyShell CMS Loader Domain DNS Query
id: eead1989-7075-4997-9f36-6ceac161e7b7
status: experimental
description: |
    Hunting starting point for the second stage of Magento PolyShell
    (CVE-2026-48356) post-exploitation. Sansec documents an obfuscated
    JavaScript loader injected into Magento CMS pages or static blocks that
    later fetches a payload from external hosts. This rule flags DNS queries
    for three domains Sansec named in that research. Domains rotate; treat
    as a seed list, not a complete C2 inventory. Pair with file hunts for
    accesson.php and PHP under media/custom_options/.
references:
    - https://sansec.io/research/magento-polyshell
    - https://www.adobe.com/trust/security/products/commerce/apsb26-73.html
    - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    - https://github.com/CyberThreatNet/hunt-lab/tree/main/hunts/2026/2026-10-27-magento-cms-loader-domains
author: Cyber-Threat.net Hunt Lab
date: 2026-10-27
tags:
    - attack.command-and-control
    - attack.t1071.001
    - attack.persistence
    - attack.t1505.003
    - cve.2026-48356
logsource:
    category: dns_query
detection:
    selection:
        query|contains:
            - 'lanhd6549tdhse.top'
            - 'jslibrary.net'
            - 'canevaslab.com'
    condition: selection
falsepositives:
    - Rare legitimate use of these hostnames (none known to us when written)
    - Threat-intel or sandbox systems resolving the same names on purpose
level: high
